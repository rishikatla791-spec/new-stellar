# Runs the test suite on every push and pull request: on Linux, with Redis
# and Docker, the way Stellar runs on a server. The suite is offline - no
# API calls and no keys - so it needs no secrets.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes an older run pointless.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      FLASK_SECRET_KEY: preview-ci-only-not-a-secret-0123456789
      REDIS_URL: redis://127.0.0.1:6379/14
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install locked preview dependencies
        run: |
          uv venv --python 3.12 .venv
          uv pip sync --python .venv/bin/python deploy/preview/requirements.lock
      - name: Test preview capabilities and gateway
        run: |
          .venv/bin/python tests/test_preview.py
          .venv/bin/python tests/test_preview_app.py
      - name: Build the isolated browser image
        run: docker build -f dockerfiles/Dockerfile.browser -t stellar-browser:1.63.0 .
      - name: Test real browser fixtures and desktop/mobile UI
        run: |
          .venv/bin/python tests/browser_integration.py
          .venv/bin/python tests/preview_ui_integration.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-ui-screenshots
          path: .test-tmp/preview-*.png
          include-hidden-files: true
          if-no-files-found: ignore

  genui:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: genui/package-lock.json
      - name: Build and audit the Generative UI runtime
        working-directory: genui
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build
          git diff --exit-code -- ../static/genui

  suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Throwaway values for this runner only; CI has no keys.env.
      FLASK_SECRET_KEY: ci-only-not-a-secret-0123456789abcdef0123456789abcdef
      REDIS_URL: redis://:ci-only-redis-password@127.0.0.1:6379/0
      # Docker is available here, so the sections that need it must run.
      STELLAR_REQUIRE_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install the locked dependencies
        run: |
          uv venv --python 3.12 .venv
          uv pip sync --python .venv/bin/python requirements.lock

      - name: Start Redis with a password
        run: |
          docker run -d --name stellar-redis -p 127.0.0.1:6379:6379 redis:7-alpine \
            redis-server --requirepass ci-only-redis-password
          for i in $(seq 1 30); do
            if docker exec stellar-redis redis-cli -a ci-only-redis-password ping 2>/dev/null | grep -q PONG; then
              exit 0
            fi
            sleep 1
          done
          echo "Redis did not start" && exit 1

      - name: Build the sandbox image
        run: .venv/bin/python docker_setup.py

      - name: Run the suite
        run: |
          .venv/bin/python tests/test_reliability.py
          node tests/frontend_reliability.cjs
          .venv/bin/python smoke_test.py
