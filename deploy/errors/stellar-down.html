<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Stellar is restarting</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
           background: #0d0f14; color: #e6e8ee;
           font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 380px; text-align: center; }
    h1 { font-size: 24px; margin: 0 0 8px; }
    p { color: #9aa0b0; font-size: 15px; line-height: 1.6; margin: 0 0 20px; }
    a { color: #6d8cff; }
  </style>
</head>
<body>
  <main>
    <h1>Stellar is restarting</h1>
    <p>It should be back within a minute. Replies that were running carry on
       on the server and can be rejoined once it is.</p>
    <p><a href="/">Try again</a></p>
  </main>
</body>
</html>
