# Shared proxy settings for Stellar.
#
# Install to: /etc/nginx/snippets/stellar_proxy.conf
#
# It lives in its own file because it is included by two server blocks -
# the main site and the wildcard for deployed apps - and a setting that
# drifted between the two would be a bug nobody could see. Anything here
# applies to both. Timeouts are NOT here: the two blocks need different
# ones (see nginx_stellar.conf).

proxy_pass http://unix:/home/stellaradmin/my_app/stellar.sock;

proxy_set_header Host              $http_host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Forwarded so that a future WebSocket terminus works without touching
# nginx again. Nothing in the app speaks WebSocket today: the subdomain
# proxy is built on `requests`, which cannot answer a 101, and Gunicorn's
# gthread worker cannot either. A deployed app that needs a WebSocket will
# fall back to polling or fail.
proxy_http_version 1.1;
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# Mandatory for Server-Sent Events. Without this nginx holds tokens in a
# buffer and releases them in lumps, which destroys live streaming.
proxy_buffering off;
proxy_cache     off;
