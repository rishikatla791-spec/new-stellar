# Shared proxy settings for Stellar.
#
# Install to: /etc/nginx/snippets/stellar_proxy.conf
#
# It lives in its own file because it is included by two server blocks -
# the main site and the wildcard for deployed apps - and a setting that
# drifted between the two would be a bug nobody could see. Anything here
# applies to both.

proxy_pass http://unix:/home/stellaradmin/my_app/stellar.sock;

proxy_set_header Host              $http_host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Forwarded so that a future WebSocket terminus works without touching
# nginx again. Note that nothing in the app speaks WebSocket today: the
# subdomain proxy is built on `requests`, which cannot answer a 101, and
# Gunicorn's gthread worker cannot either. A deployed app that needs a
# WebSocket will fall back to polling or fail. That is Phase 11's job.
proxy_http_version 1.1;
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# Mandatory for Server-Sent Events. Without this nginx holds tokens in a
# buffer and releases them in lumps, which destroys live streaming.
proxy_buffering off;
proxy_cache     off;

# A turn can legitimately run for a long time: a tool may block for ten
# minutes waiting on a click, and the idle timeout inside the app is 900s.
# These must exceed that or nginx cuts the stream while it is still alive.
proxy_connect_timeout 3600s;
proxy_send_timeout    3600s;
proxy_read_timeout    3600s;
send_timeout          3600s;
