# Stellar production nginx configuration.
#
# Install:
#   sudo cp deploy/stellar_proxy_snippet.conf /etc/nginx/snippets/stellar_proxy.conf
#   sudo cp deploy/nginx_stellar.conf         /etc/nginx/sites-available/stellar
#   sudo ln -s /etc/nginx/sites-available/stellar /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace every stellarai.site below with your own domain, and set
# STELLAR_DOMAIN in keys.env to the same value. They must agree: nginx
# decides which requests arrive, and the app decides which Host header
# counts as a deployed app rather than the main site.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------------------------------------------------------------------
# Everything over http goes to https, main site and deployed apps alike.
# ---------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name stellarai.site *.stellarai.site;

    # Certbot renewals must survive the redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------
# The main site.
# ---------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name stellarai.site;

    ssl_certificate     /etc/letsencrypt/live/stellarai.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stellarai.site/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    # Stellar's own CSS and JavaScript, served straight off disk.
    #
    # This is in the MAIN server block only, deliberately. When it sat in a
    # block that also matched *.stellarai.site it matched before location /
    # for every host, so a request for https://someapp.stellarai.site/static/
    # was answered out of Stellar's own static directory instead of being
    # proxied to that app's container. Every deployed Flask, Django or
    # React app serves its assets from /static/ by default, so all of them
    # loaded their HTML and then 404'd on every stylesheet and script.
    location /static/ {
        alias /home/stellaradmin/my_app/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location / {
        include /etc/nginx/snippets/stellar_proxy.conf;
    }
}

# ---------------------------------------------------------------------
# Deployed apps: <name>.stellarai.site
#
# No /static/ rule here, so an app's own assets reach its own container.
# The request still goes to Gunicorn, where the app's subdomain handler
# reads the Host header and proxies it on to the right container.
# ---------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name *.stellarai.site;

    ssl_certificate     /etc/letsencrypt/live/stellarai.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stellarai.site/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    location / {
        include /etc/nginx/snippets/stellar_proxy.conf;
    }
}
