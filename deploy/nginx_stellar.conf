# Stellar production nginx configuration.
#
# Install:
#   sudo cp deploy/stellar_proxy_snippet.conf /etc/nginx/snippets/stellar_proxy.conf
#   sudo cp deploy/nginx_stellar.conf         /etc/nginx/sites-available/stellar
#   sudo ln -s /etc/nginx/sites-available/stellar /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace every example.com below with your own domain, and set
# STELLAR_DOMAIN in keys.env (or the systemd unit) to the same value. They
# must agree: nginx decides which requests arrive, and the app decides
# which Host header counts as a deployed app rather than the main site.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Connections per deployed app (by host name). Every request to an app
# holds one of Stellar's worker threads while it runs; the app also caps
# them itself, and this stops one busy app from queueing up the rest.
limit_conn_zone $host zone=per_app:10m;

# ---------------------------------------------------------------------
# Everything over http goes to https, main site and deployed apps alike.
# ---------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name example.com *.example.com;

    # Certbot renewals must survive the redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------
# The main site.
# ---------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # HTTPS only from now on, for this site and every app under it. The app
    # sets its own frame, sniffing, referrer and content policies.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 50M;

    # While Stellar restarts (or is down), a page that says so instead of
    # nginx's bare 502.
    error_page 502 503 504 /stellar-down.html;
    location = /stellar-down.html {
        root /home/stellaradmin/my_app/deploy/errors;
        internal;
    }

    # Stellar's own CSS and JavaScript, served straight off disk.
    #
    # This is in the MAIN server block only, deliberately. When it sat in a
    # block that also matched *.example.com it matched before location /
    # for every host, so a request for https://someapp.example.com/static/
    # was answered out of Stellar's own static directory instead of being
    # proxied to that app's container. Every deployed Flask, Django or
    # React app serves its assets from /static/ by default, so all of them
    # loaded their HTML and then 404'd on every stylesheet and script.
    location /static/ {
        alias /home/stellaradmin/my_app/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location / {
        include /etc/nginx/snippets/stellar_proxy.conf;
        # A reply can legitimately stream for a long time: a tool may wait
        # ten minutes on a click, and the app's own idle limit is 900 s.
        # These must exceed that or nginx cuts a stream that is still alive.
        proxy_connect_timeout 3600s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;
        send_timeout          3600s;
    }
}

# ---------------------------------------------------------------------
# Deployed apps: <name>.example.com
#
# No /static/ rule here, so an app's own assets reach its own container.
# The request still goes to Gunicorn, where the app's subdomain handler
# reads the Host header and proxies it on to the right container.
# ---------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name *.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 50M;

    location / {
        include /etc/nginx/snippets/stellar_proxy.conf;
        limit_conn per_app 20;
        # Apps get short timeouts: the app proxy itself gives up after 60 s
        # without a byte, and nothing on an app should hold a worker longer.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        send_timeout          120s;
    }
}
