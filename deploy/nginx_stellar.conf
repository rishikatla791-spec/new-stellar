# Stellar Production Nginx Configuration
# Place in: /etc/nginx/sites-available/stellar
# Symlink:  sudo ln -s /etc/nginx/sites-available/stellar /etc/nginx/sites-enabled/
# Test:     sudo nginx -t && sudo systemctl reload nginx

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name stellarai.site *.stellarai.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name stellarai.site *.stellarai.site;

    # SSL Certificates (Managed via certbot for *.stellarai.site and stellarai.site)
    ssl_certificate /etc/letsencrypt/live/stellarai.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stellarai.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    # Main root location: passes both main app traffic and wildcard subdomain traffic
    # to Gunicorn. Stellar's internal reverse proxy handler dispatches *.stellarai.site
    # to the appropriate isolated container while preserving live streaming.
    location / {
        proxy_pass http://unix:/home/stellaradmin/my_app/stellar.sock;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / PTY Upgrade support (for interactive terminals)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Mandatory for Server-Sent Events (SSE) token streaming:
        # Buffering MUST be disabled so tokens flow to the browser immediately.
        proxy_buffering off;
        proxy_cache off;

        # Long timeout for extended LLM tool calls and multi-turn loops
        proxy_connect_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        send_timeout 3600s;
    }

    # Static assets caching
    location /static/ {
        alias /home/stellaradmin/my_app/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
