<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Stellar{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="alternate icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/xterm.css') }}">
</head>
<body>
  {# Flash messages come from flash() in auth.py and survive one redirect. #}
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="flashes">
        {% for message in messages %}<div class="flash">{{ message }}</div>{% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  {% block body %}{% endblock %}

  <script src="{{ url_for('static', filename='vendor/xterm.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/xterm-addon-fit.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
